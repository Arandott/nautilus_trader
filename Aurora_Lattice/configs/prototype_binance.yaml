strategy:
  strategy_id: "AURORA-HDG"
  order_id_tag: "AHDG"
  instrument_id: "SOLUSDT-PERP.BINANCE"
  tick_size: 0.1
  base_symbol: "SOLUSDT"

  grid:
    levels: 3
    k_sigma: 0.9
    k_s: 0.5
    k_f: 0.6
    fee_buffer_bps: 0
    delta_entry_ticks: 1.0
    exit_cost_bps: 0.0
    q_mm: 0.0
    unfilled_penalty_ticks: 0.0
    reanchor_rho: 1.2
    reanchor_timeout_ms: 400

  inventory:
    i_max: 0.02
    i_soft: 0.012
    gamma: 2.0e-6
    kappa_alpha: 0.8
    beta_i: 0.6
    theta_i: 0.8
    base_qty: 0.05
    eta: 0.35
    q_min: 0.04
    q_max: 0.1

  alpha:
    tau_ms: 300
    a_max_bps: 3.0
    a_gate_bps: 1.2
    beta_alpha: 0.25
    kappa_delta: 0.25
    rls_forgetting: 0.995

  fill_model:
    tau_ms: 300
    ttl_ratio: 0.7
    lambda_window_ms: 300
    use_empirical_touch: true
    min_p_fill: 0.15

  exec:
    msg_rate_budget: 40
    maker_fee_bps: 0.0
    taker_fee_bps: 2.0

  risk:
    mode: "normal_only"
    shock_mode_sigma_mult: 2.5
    hedge_cooldown_ms: 800
    hedge_min_qty: 0.002

  regime:
    alpha_gate_bps: 1.2
    trend_delta_ratio_threshold: 0.6
    mo_imbalance_threshold: 2.5
    hysteresis_ms: 800
    trend_opposite_clip_levels: 1
    trend_widen_mult: 1.15
    trend_reduce_levels: 1
    chaos_widen_mult: 2.0
    chaos_reduce_levels: 2
    pause_on_chaos: true

  position_risk:
    H_max_normal_ms: 2500
    H_max_trend_ms: 1500
    H_max_chaos_ms: 800
    t_since_flat_threshold_I_ratio: 0.1

  taker:
    taker_budget_bps_per_hour: 8.0
    taker_clip_qty: 0.004
    taker_max_slippage_bps: 3.0
    cooldown_ms: 500

runtime:
  trader_id: "AURORA-HDG-BINANCE"
  log_level: "INFO"
  log_level_file: "INFO"
  log_file_name: "aurora-hdg"
  log_file_max_size: 10485760  # rotate log files at ~100MB
  log_directory: "../data/logs"
  catalog_path: "../data/catalog"
  trading_mode: "live"

  clients:
    BINANCE_PERP:
      venue: "BINANCE"
      account_type: "USDT_FUTURES"
      use_data_client: true
      use_exec_client: true
      update_instruments_interval_mins: 60
      futures_leverage: 20
      use_position_ids: false
      use_reduce_only: false
      max_retries: 3
      retry_delay_initial_ms: 1000
      retry_delay_max_ms: 10000
      instrument_ids:
        - "SOLUSDT-PERP.BINANCE"

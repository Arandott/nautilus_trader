[package]
name = "nautilus-aurora"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Aurora strategy support primitives and reusable Rust logic"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_aurora"
crate-type = ["rlib"]

[features]
default = []
python = ["dep:pyo3", "nautilus-core/python", "nautilus-model/python"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
anyhow = { workspace = true }
nautilus-model = { workspace = true }
nautilus-core = { workspace = true }
nautilus-indicators = { workspace = true }
arc-swap = "1.7.1"

statrs = "0.16.1"
pyo3 = { workspace = true, optional = true }
log = { workspace = true }

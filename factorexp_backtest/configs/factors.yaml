# Factor configurations for backtesting
# Each factor uses Clip(ZScore(expression, period), min, max) format
# The output directly maps to position sizing under 2x leverage

# ==============================================================================
# PHASE C EXTENSION: Multi-Instrument×Factor Batch Backtesting Support
# ==============================================================================
# This config now supports:
# - Multiple instruments definition
# - Instrument×factor run combinations
# - Backward compatibility: Single factor mode still works via CLI
# ==============================================================================

# Instrument definitions (Phase C)
# Define all instruments available for backtesting
# NOTE: Use full instrument IDs with suffix (-PERP for perpetuals, -FUTURE for futures)
#       This ensures proper margin requirements (5% init / 2.5% maint for perpetuals)
instruments:
  # BTC pairs
  BTCUSDT-PERP:
    venue: BINANCE
    bar_spec: 15-MINUTE-LAST-EXTERNAL
    base_currency: BTC
    quote_currency: USDT
    data_source: catalog  # or "feather" for fallback

  # ETH pairs
  ETHUSDT-PERP:
    venue: BINANCE
    bar_spec: 15-MINUTE-LAST-EXTERNAL
    base_currency: ETH
    quote_currency: USDT
    data_source: catalog


# Default parameters
defaults:
  zscore_period: 5760  # 60 days of 15-minute bars (60 * 24 * 4)
  clip_min: -2.0       # Min position: -2x (short)
  clip_max: 2.0        # Max position: +2x (long)
  warmup_period: 5760  # Warmup period for indicators
  rebalance_interval: 30  # Default rebalance every 30 bars

# Factor definitions (each runs independently)
factors:
  # VWAP-based factors
  vwap_return_std:
    name: "VWAP Return Volatility"
    expression: "Clip(ZScore(TS_Std(When(Greater(TS_Delta($volume, 1), 0), Div(Sub(Div($amt, $volume), TS_Ref(Div($amt, $volume), 1)), TS_Ref(Div($amt, $volume), 1)), Div(0, 0)), 96), 5760), -2, 2)"
    description: "Standard deviation of VWAP returns over 1440 bars (15 days), filtered for positive volume changes"
    requires_extended: true

  posvolume_vwap_ret_volatility_96:
    name: "Positive Volume VWAP Return Volatility (96)"
    expression: "Clip(ZScore(TS_Std(When(Greater(TS_Delta($volume, 1), 0), Div(Sub(Div($amt, $volume), TS_Ref(Div($amt, $volume), 1)), TS_Ref(Div($amt, $volume), 1)), Div(0, 0)), 96), 5760), -2, 2)"
    description: "96-bar volatility of VWAP returns filtered for positive volume delta."
    requires_extended: true

  negvolume_vwap_ret_volatility_96:
    name: "Negative Volume VWAP Return Volatility (96)"
    expression: "Clip(ZScore(TS_Std(When(Less(TS_Delta($volume, 1), 0), Div(Sub(Div($amt, $volume), TS_Ref(Div($amt, $volume), 1)), TS_Ref(Div($amt, $volume), 1)), Div(0, 0)), 96), 5760), -2, 2)"
    description: "96-bar volatility of VWAP returns filtered for negative volume delta."
    requires_extended: true

  posvolume_close_ret_volatility_96:
    name: "Positive Volume Close Return Volatility (96)"
    expression: "Clip(ZScore(TS_Std(When(Greater(TS_Delta($volume, 1), 0), Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), Div(0, 0)), 96), 5760), -2, 2)"
    description: "96-bar volatility of close returns filtered for positive volume delta."

  negvolume_close_ret_volatility_96:
    name: "Negative Volume Close Return Volatility (96)"
    expression: "Clip(ZScore(TS_Std(When(Less(TS_Delta($volume, 1), 0), Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), Div(0, 0)), 96), 5760), -2, 2)"
    description: "96-bar volatility of close returns filtered for negative volume delta."

  rsj_close_ret_96:
    name: "RSJ Close Return Ratio (96)"
    expression: "Clip(ZScore(Div(Sub(TS_Sum(When(Greater(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), 0), Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), Div(0, 0)), 96), TS_Sum(When(Less(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), 0), Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), Div(0, 0)), 96)), TS_Sum(Pow(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), 2), 96)), 5760), -2, 2)"
    description: "RSJ ratio of close returns over 96 bars."

  gp1_2_3_96:
    name: "Close to Open Volatility (96)"
    expression: "Clip(ZScore(TS_Std(Div($close, $open), 96), 5760), -2, 2)"
    description: "96-bar volatility of the close/open price ratio."

  smtmny1_ret_to_volume_close_ret_abs_mean_shigh_96:
    name: "Smart Money Close Abs Return Mean High (96)"
    expression: "Clip(ZScore(TS_MeanSelQ(Abs(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1))), Div(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), $volume), 96, 0.8, 1.0), 5760), -2, 2)"
    description: "MeanSelQ of absolute close returns using top 20% return-to-volume scores."

  smtmny1_ret_to_volume_close_ret_abs_mean_slow_96:
    name: "Smart Money Close Abs Return Mean Low (96)"
    expression: "Clip(ZScore(TS_MeanSelQ(Abs(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1))), Div(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), $volume), 96, 0.0, 0.2), 5760), -2, 2)"
    description: "MeanSelQ of absolute close returns using bottom 20% return-to-volume scores."

  smtmny1_ret_to_volume_vwap_ret_abs_mean_shigh_96:
    name: "Smart Money VWAP Abs Return Mean High (96)"
    expression: "Clip(ZScore(TS_MeanSelQ(Abs(Div(Sub(Div($amt, $volume), TS_Ref(Div($amt, $volume), 1)), TS_Ref(Div($amt, $volume), 1))), Div(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), $volume), 96, 0.8, 1.0), 5760), -2, 2)"
    description: "MeanSelQ of absolute VWAP returns using top 20% close return-to-volume scores."
    requires_extended: true

  smtmny1_ret_to_volume_vwap_ret_abs_mean_slow_96:
    name: "Smart Money VWAP Abs Return Mean Low (96)"
    expression: "Clip(ZScore(TS_MeanSelQ(Abs(Div(Sub(Div($amt, $volume), TS_Ref(Div($amt, $volume), 1)), TS_Ref(Div($amt, $volume), 1))), Div(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), $volume), 96, 0.0, 0.2), 5760), -2, 2)"
    description: "MeanSelQ of absolute VWAP returns using bottom 20% close return-to-volume scores."
    requires_extended: true

  smtmny1_abs_ret_to_volume_close_ret_abs_mean_shigh_96:
    name: "Smart Money Abs Close Return Mean High (96)"
    expression: "Clip(ZScore(TS_MeanSelQ(Abs(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1))), Abs(Div(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), $volume)), 96, 0.8, 1.0), 5760), -2, 2)"
    description: "MeanSelQ of absolute close returns using absolute return-to-volume weights."

  smtmny1_abs_ret_to_volume_vwap_ret_abs_mean_shigh_96:
    name: "Smart Money Abs VWAP Return Mean High (96)"
    expression: "Clip(ZScore(TS_MeanSelQ(Abs(Div(Sub(Div($amt, $volume), TS_Ref(Div($amt, $volume), 1)), TS_Ref(Div($amt, $volume), 1))), Abs(Div(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), $volume)), 96, 0.8, 1.0), 5760), -2, 2)"
    description: "MeanSelQ of absolute VWAP returns using absolute close return-to-volume weights."
    requires_extended: true

  statenum1_vwap_ret_std_96:
    name: "VWAP Return Volatility (96)"
    expression: "Clip(ZScore(TS_Std(Div(Sub(Div($amt, $volume), TS_Ref(Div($amt, $volume), 1)), TS_Ref(Div($amt, $volume), 1)), 96), 5760), -2, 2)"
    description: "96-bar volatility of VWAP returns."
    requires_extended: true

  statenum1_vwap_ret_pow05_mean_96:
    name: "VWAP Return Pow0.5 Mean (96)"
    expression: "Clip(ZScore(TS_Mean(Pow(Div(Sub(Div($amt, $volume), TS_Ref(Div($amt, $volume), 1)), TS_Ref(Div($amt, $volume), 1)), 0.5), 96), 5760), -2, 2)"
    description: "Mean of square-root VWAP returns over 96 bars."
    requires_extended: true

  statenum1_vwap_ret_pow2_pow05_mean_96:
    name: "VWAP Return Pow2 Pow0.5 Mean (96)"
    expression: "Clip(ZScore(TS_Mean(Pow(Pow(Div(Sub(Div($amt, $volume), TS_Ref(Div($amt, $volume), 1)), TS_Ref(Div($amt, $volume), 1)), 2), 0.5), 96), 5760), -2, 2)"
    description: "Mean of sqrt squared VWAP returns (i.e., abs returns) over 96 bars."
    requires_extended: true

  statenum1_vwap_ret_pow2_median_96:
    name: "VWAP Return Pow2 Median (96)"
    expression: "Clip(ZScore(TS_Quantile(Pow(Div(Sub(Div($amt, $volume), TS_Ref(Div($amt, $volume), 1)), TS_Ref(Div($amt, $volume), 1)), 2), 96, 0.5), 5760), -2, 2)"
    description: "Median of squared VWAP returns over 96 bars."
    requires_extended: true

  statenum1_close_ret_std_96:
    name: "Close Return Volatility (96)"
    expression: "Clip(ZScore(TS_Std(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), 96), 5760), -2, 2)"
    description: "96-bar volatility of close returns."

  statenum1_close_ret_pow05_mean_96:
    name: "Close Return Pow0.5 Mean (96)"
    expression: "Clip(ZScore(TS_Mean(Pow(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), 0.5), 96), 5760), -2, 2)"
    description: "Mean of square-root close returns over 96 bars."

  statenum1_close_ret_pow2_pow05_mean_96:
    name: "Close Return Pow2 Pow0.5 Mean (96)"
    expression: "Clip(ZScore(TS_Mean(Pow(Pow(Div(Sub($close, TS_Ref($close, 1)), TS_Ref($close, 1)), 2), 0.5), 96), 5760), -2, 2)"
    description: "Mean of sqrt squared close returns (i.e., abs returns) over 96 bars."

  statenum1_volume_pow05_mean_96:
    name: "Volume Pow0.5 Mean (96)"
    expression: "Clip(ZScore(TS_Mean(Pow($volume, 0.5), 96), 5760), -2, 2)"
    description: "Mean of square-root volume over 96 bars."

# Risk management
risk_management:
  max_position_size: 2.0      # Maximum position size (2x leverage)
  stop_loss: 0.1              # 5% stop loss
  min_rebalance_interval: 5   # Minimum bars between rebalances
  max_rebalance_interval: 480  # Maximum bars between rebalances (5 days)

# Execution settings
execution:
  slippage_bps: 0            # 10 basis points slippage
  commission_bps: 1.34           # 3 basis points commission (0.0134%)
  min_order_size: 0.001       # Minimum order size
  max_order_size: 100.0       # Maximum order size

# ==============================================================================
# Run Definitions (Phase C)
# ==============================================================================
# Define instrument×factor combinations for batch backtesting
# Each run represents one backtest job
#
# Usage:
#   python run_backtest.py --run-id btc_amt_momentum     # Run single
#   python run_backtest.py --all-runs                    # Run all enabled
#   python run_backtest.py --all-runs --max-workers 4    # Parallel execution
# ==============================================================================

runs:
  # VWAP return volatility factors (NEW)
  btc_vwap_return_std:
    instrument: BTCUSDT-PERP
    factor: vwap_return_std
    enabled: true
    position_scale: 1.0

 

[package]
name = "extended_bar_macros"
version = "0.1.0"
edition = "2021"
description = "Procedural and declarative macros for Nautilus extended bar fields"
license = "LGPL-3.0-only"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
syn = { version = "2", features = ["full"] }
toml = "0.8"

[features]

